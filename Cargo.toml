[package]
name = "Ferrous_bitboards"
version = "0.5.0-dev"
edition = "2024"

[dependencies]
macroquad = { version = "0.4.16", optional = true }
serde_json = { version = "1.0.151", optional = true }
once_cell = "1.21.4"
serde = { version = "1.0.229", optional = true }
serde_derive = { version = "1.0.229", optional = true }

[profile.dev]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1

[features]
debug-ui = ["dep:macroquad"]
opening-book = ["serde", "serde_json", "serde_derive"]
